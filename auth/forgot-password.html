<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | ProjectHub Enterprise</title>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <a href="../index.html" class="logo">ProjectHub</a>
    </div>

    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

    <form onsubmit="event.preventDefault(); document.getElementById('resetMsg').style.display='block';">
      <div class="auth-input-group">
        <label class="auth-label" for="resetEmail">Email Address</label>
        <input type="email" id="resetEmail" class="auth-input" placeholder="name@company.com" required value="alex.morgan@enterprise.com" />
      </div>

      <div id="resetMsg" style="display:none;padding:12px;background:rgba(46,125,50,0.15);border:1px solid rgba(46,125,50,0.4);border-radius:var(--radius-md);color:#81c784;font-size:13px;margin-bottom:16px;">
        <span class="material-symbols-outlined" style="vertical-align:middle;font-size:16px;margin-right:4px;">mark_email_read</span>
        Password reset instructions sent. Please check your inbox.
      </div>

      <button type="submit" class="auth-btn-primary">Send Reset Link</button>

      <div class="auth-footer-prompt">
        <a href="login.html" class="auth-link">&larr; Back to Login</a>
      </div>
    </form>
  </div>
</div>

<footer class="auth-bottom-nav">
  <a href="#">Privacy Policy</a>
  <a href="#">Terms of Service</a>
  <a href="#">Security</a>
  <a href="../contact.html">Contact</a>
  <span>&copy; 2024 ProjectHub Enterprise. All rights reserved.</span>
</footer>

</body>
</html>
