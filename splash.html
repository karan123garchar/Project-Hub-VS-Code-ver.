<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectHub — Initializing</title>
  <meta name="description" content="ProjectHub — Welcome to the Future of Enterprise Software." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FBF9F4;
      --gold: #C69214;
      --gold-dark: #A5780C;
      --gold-glow: rgba(198, 146, 20, 0.18);
      --charcoal: #111111;
      --muted: #888888;
      --card-bg: #ECE9E1;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ── BACKGROUND GRAIN TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 70% 50% at 50% 50%, rgba(198,146,20,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── MAIN STAGE ── */
    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      gap: 0;
    }

    /* ── PAGE FADE OUT ── */
    .stage.fade-out {
      animation: pageExit 0.7s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    @keyframes pageExit {
      to { opacity: 0; transform: scale(0.98); }
    }

    /* ─────────────────────────────────────────────
       EMBLEM — Concentric Rings + Animated Logo
    ───────────────────────────────────────────── */
    .emblem-stage {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    /* Decorative tick marks on outer ring */
    .tick-ring {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      animation: rotateSlow 60s linear infinite;
    }

    /* Gold ring 1 — outermost */
    .ring-1 {
      position: absolute;
      width: 272px;
      height: 272px;
      border-radius: 50%;
      border: 1px solid rgba(198,146,20,0.22);
      animation: rotateSlow 48s linear infinite;
    }

    /* Gold ring 2 */
    .ring-2 {
      position: absolute;
      width: 248px;
      height: 248px;
      border-radius: 50%;
      border: 1px solid rgba(198,146,20,0.40);
      box-shadow: 0 0 32px rgba(198,146,20,0.06) inset;
      animation: rotateCounter 36s linear infinite;
    }

    /* Dashed inner ring */
    .ring-3 {
      position: absolute;
      width: 224px;
      height: 224px;
      border-radius: 50%;
      border: 1px dashed rgba(198,146,20,0.28);
      animation: rotateSlow 24s linear infinite;
    }

    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes rotateCounter {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    /* ── CENTER CARD ── */
    .logo-card {
      position: relative;
      z-index: 10;
      width: 182px;
      height: 182px;
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow:
        0 2px 6px rgba(0,0,0,0.06),
        0 8px 24px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
    }

    /* ── SVG LOGO ── */
    .ph-logo-svg {
      width: 108px;
      height: 108px;
      overflow: visible;
    }

    /* Outer orbit group — spins slowly */
    .g-orbit {
      transform-origin: 54px 54px;
      animation: spinOrbit 16s linear infinite;
    }

    /* Inner axis / needle — pulse */
    .g-needle {
      transform-origin: 54px 54px;
      animation: needlePulse 3.5s ease-in-out infinite alternate;
    }

    /* Center hub dot — glow pulse */
    .hub-dot {
      animation: hubGlow 2.5s ease-in-out infinite alternate;
    }

    @keyframes spinOrbit {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes needlePulse {
      0%   { transform: rotate(-3deg) scale(0.98); opacity: 0.9; }
      100% { transform: rotate(3deg)  scale(1.02); opacity: 1; }
    }
    @keyframes hubGlow {
      0%   { filter: drop-shadow(0 0 2px rgba(198,146,20,0.5)); }
      100% { filter: drop-shadow(0 0 8px rgba(198,146,20,0.9)); }
    }

    /* ── WORDMARK IN CARD ── */
    .card-brand {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .card-brand em {
      color: var(--gold);
      font-style: normal;
    }

    /* ─────────────────────────────────────────────
       TYPOGRAPHY BLOCK
    ───────────────────────────────────────────── */
    .text-block {
      text-align: center;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    .main-title {
      font-family: var(--serif);
      font-size: 52px;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: -0.025em;
      line-height: 1.08;
      margin-bottom: 12px;
    }

    .main-sub {
      font-size: 16px;
      font-weight: 400;
      color: #666666;
      letter-spacing: -0.005em;
      line-height: 1.55;
    }

    /* ─────────────────────────────────────────────
       VERTICAL LOADER
    ───────────────────────────────────────────── */
    .loader-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .v-track {
      width: 1.5px;
      height: 56px;
      background: #DDD9CF;
      position: relative;
      border-radius: 2px;
      overflow: hidden;
    }

    .v-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
      animation: fillBar 2.6s cubic-bezier(0.4, 0, 0.15, 1) 0.9s forwards;
    }

    @keyframes fillBar {
      0%   { height: 0%; }
      15%  { height: 20%; }
      40%  { height: 52%; }
      72%  { height: 78%; }
      100% { height: 100%; }
    }

    .status-label {
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: var(--gold);
      animation: labelPulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes labelPulse {
      0%   { opacity: 0.65; }
      100% { opacity: 1; }
    }

    /* ─────────────────────────────────────────────
       3-ROLE GATEWAY
    ───────────────────────────────────────────── */
    .gateway {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
    }

    .gateway-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #AAAAAA;
    }

    .role-cards {
      display: flex;
      gap: 10px;
    }

    .role-card {
      background: #FFFFFF;
      border: 1px solid #EBE5DB;
      border-radius: 10px;
      padding: 14px 14px 12px;
      width: 130px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .role-card::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    .role-card:hover {
      border-color: rgba(198,146,20,0.6);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(198,146,20,0.12);
    }

    .role-card:hover::before {
      transform: scaleX(1);
    }

    .role-card.selected {
      border-color: var(--gold);
      background: rgba(198,146,20,0.06);
    }

    .role-card.selected::before {
      transform: scaleX(1);
    }

    .role-icon {
      font-size: 24px;
      color: var(--gold);
    }

    .role-name {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: -0.01em;
    }

    .role-desc {
      font-size: 10px;
      color: #999999;
      line-height: 1.35;
    }

    /* Actions row */
    .actions {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 4px;
    }

    .btn-enter {
      background: var(--charcoal);
      color: #FFFFFF;
      border: none;
      padding: 11px 28px;
      border-radius: 28px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-enter:hover {
      background: #2A2A2A;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }

    .btn-enter .mat-icon {
      font-family: 'Material Symbols Outlined';
      font-size: 16px;
      font-weight: 400;
      font-style: normal;
    }

    .link-signin {
      color: var(--gold);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px dotted rgba(198,146,20,0.5);
      transition: border-color 0.15s;
    }

    .link-signin:hover {
      border-color: var(--gold);
    }

    /* Auto timer note */
    .timer-note {
      font-size: 11px;
      color: #BBBBBB;
      font-style: italic;
      margin-top: 2px;
    }

    /* Fade up keyframe */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 520px) {
      .main-title { font-size: 36px; }
      .emblem-stage { width: 220px; height: 220px; }
      .ring-1 { width: 212px; height: 212px; }
      .ring-2 { width: 192px; height: 192px; }
      .ring-3 { width: 174px; height: 174px; }
      .logo-card { width: 148px; height: 148px; }
      .ph-logo-svg { width: 88px; height: 88px; }
      .role-cards { flex-direction: column; align-items: center; }
      .role-card { width: 200px; }
    }
  </style>
</head>
<body>

<main class="stage" id="stage">

  <!-- ── ANIMATED EMBLEM ── -->
  <div class="emblem-stage">

    <!-- Decorative outer rings -->
    <div class="ring-1"></div>
    <div class="ring-2"></div>
    <div class="ring-3"></div>

    <!-- Center logo card -->
    <div class="logo-card">

      <!-- ProjectHub Compass / Network SVG -->
      <svg class="ph-logo-svg" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- Outer gold circle -->
        <circle cx="54" cy="54" r="36"
          stroke="#C69214" stroke-width="1.4" stroke-opacity="0.75" />

        <!-- Middle dashed circle -->
        <circle cx="54" cy="54" r="23"
          stroke="#C69214" stroke-width="1" stroke-dasharray="2.5 3.5" stroke-opacity="0.65" />

        <!-- Inner tight circle -->
        <circle cx="54" cy="54" r="11"
          stroke="#C69214" stroke-width="0.9" stroke-opacity="0.85" />

        <!-- Rotating orbit layer — 8 spokes + nodes -->
        <g class="g-orbit">
          <!-- N -->
          <line x1="54" y1="18" x2="54" y2="32" stroke="#C69214" stroke-width="1.4"/>
          <circle cx="54" cy="18" r="3.5" stroke="#C69214" stroke-width="1.4" fill="#ECE9E1"/>

          <!-- NE -->
          <line x1="78.2" y1="29.8" x2="68.8" y2="39.2" stroke="#C69214" stroke-width="1.3"/>
          <circle cx="78.2" cy="29.8" r="3.2" stroke="#C69214" stroke-width="1.3" fill="#ECE9E1"/>

          <!-- E -->
          <line x1="90" y1="54" x2="77" y2="54" stroke="#C69214" stroke-width="1.4"/>
          <circle cx="90" cy="54" r="3.8" stroke="#111111" stroke-width="1.4" fill="#ECE9E1"/>

          <!-- SE -->
          <line x1="78.2" y1="78.2" x2="68.8" y2="68.8" stroke="#C69214" stroke-width="1.3"/>
          <circle cx="78.2" cy="78.2" r="3.2" stroke="#C69214" stroke-width="1.3" fill="#ECE9E1"/>

          <!-- S -->
          <line x1="54" y1="90" x2="54" y2="77" stroke="#C69214" stroke-width="1.4"/>
          <circle cx="54" cy="90" r="3.5" stroke="#C69214" stroke-width="1.4" fill="#ECE9E1"/>

          <!-- SW -->
          <line x1="29.8" y1="78.2" x2="39.2" y2="68.8" stroke="#C69214" stroke-width="1.3"/>
          <circle cx="29.8" cy="78.2" r="3.2" stroke="#C69214" stroke-width="1.3" fill="#ECE9E1"/>

          <!-- W -->
          <line x1="18" y1="54" x2="31" y2="54" stroke="#C69214" stroke-width="1.4"/>
          <circle cx="18" cy="54" r="3.5" stroke="#C69214" stroke-width="1.4" fill="#ECE9E1"/>

          <!-- NW -->
          <line x1="29.8" y1="29.8" x2="39.2" y2="39.2" stroke="#C69214" stroke-width="1.3"/>
          <circle cx="29.8" cy="29.8" r="3.2" stroke="#C69214" stroke-width="1.3" fill="#ECE9E1"/>
        </g>

        <!-- Static needle axis (N-S + W-E cross) -->
        <g class="g-needle">
          <!-- Vertical needle -->
          <line x1="54" y1="26" x2="54" y2="82" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
          <!-- Horizontal shorter arm -->
          <line x1="54" y1="54" x2="84" y2="54" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Hub pivot ring -->
          <circle cx="54" cy="54" r="5.5" fill="#111111" stroke="#C69214" stroke-width="1.8"/>
          <!-- Center dot -->
          <circle class="hub-dot" cx="54" cy="54" r="2" fill="#ECE9E1"/>
        </g>

      </svg>

      <!-- Wordmark inside card -->
      <div class="card-brand">Project<em>Hub</em></div>
    </div>
  </div>

  <!-- ── TYPOGRAPHY ── -->
  <div class="text-block">
    <h1 class="main-title">ProjectHub</h1>
    <p class="main-sub">Welcome to the Future of Enterprise Software.</p>
  </div>

  <!-- ── VERTICAL LOADING BAR ── -->
  <div class="loader-block">
    <div class="v-track">
      <div class="v-fill"></div>
    </div>
    <div class="status-label" id="statusLabel">Initializing</div>
  </div>

  <!-- ── ROLE GATEWAY ── -->
  <div class="gateway">
    <div class="gateway-label">Choose Workspace</div>

    <div class="role-cards">
      <button class="role-card selected" id="roleUser" onclick="selectRole('user', this)">
        <span class="material-symbols-outlined role-icon">person</span>
        <span class="role-name">Client</span>
        <span class="role-desc">Browse &amp; send inquiries</span>
      </button>

      <button class="role-card" id="roleDeveloper" onclick="selectRole('developer', this)">
        <span class="material-symbols-outlined role-icon">code</span>
        <span class="role-name">Developer</span>
        <span class="role-desc">Post projects &amp; manage studio</span>
      </button>

      <button class="role-card" id="roleAdmin" onclick="selectRole('admin', this)">
        <span class="material-symbols-outlined role-icon">shield</span>
        <span class="role-name">Admin</span>
        <span class="role-desc">Master control &amp; moderation</span>
      </button>
    </div>

    <div class="actions">
      <button class="btn-enter" onclick="enterPlatform()">
        Enter Platform
        <span class="mat-icon">arrow_forward</span>
      </button>
      <a href="auth/login.html" class="link-signin">Sign In →</a>
    </div>

    <div class="timer-note" id="timerNote">Auto-entering in <span id="timerCount">5</span>s</div>
  </div>

</main>

<script>
  /* ─── State ─── */
  let selectedRole = localStorage.getItem('currentUserRole') || 'user';
  let countdown = 5;
  let timer;

  /* Highlight persisted role on load */
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
  const defaultCard = {user:'roleUser', developer:'roleDeveloper', admin:'roleAdmin'}[selectedRole];
  if (defaultCard) document.getElementById(defaultCard)?.classList.add('selected');

  /* ─── Status label animation ─── */
  const labels = ['Initializing', 'Verifying Guild Contracts', 'Loading Enterprise Vault', 'Authenticating Endpoints', 'Ready'];
  let li = 0;
  const lbl = document.getElementById('statusLabel');
  const labelTimer = setInterval(() => {
    li++;
    if (li < labels.length) {
      lbl.style.opacity = '0';
      setTimeout(() => { lbl.textContent = labels[li]; lbl.style.opacity = ''; }, 250);
    }
    if (li >= labels.length - 1) clearInterval(labelTimer);
  }, 600);

  /* ─── Auto-enter countdown (starts after gateway appears ~1.8s) ─── */
  setTimeout(() => {
    timer = setInterval(() => {
      countdown--;
      const n = document.getElementById('timerCount');
      if (n) n.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        enterPlatform();
      }
    }, 1000);
  }, 1900);

  /* ─── Role selection ─── */
  function selectRole(role, el) {
    selectedRole = role;
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    // pause auto-timer if user is interacting
    clearInterval(timer);
    const note = document.getElementById('timerNote');
    if (note) note.textContent = 'Click "Enter Platform" to continue';
  }

  /* ─── Navigate ─── */
  function enterPlatform() {
    clearInterval(timer);
    localStorage.setItem('currentUserRole', selectedRole);

    const stage = document.getElementById('stage');
    stage.classList.add('fade-out');

    setTimeout(() => {
      if (selectedRole === 'developer') {
        window.location.href = 'developer/dashboard.html';
      } else if (selectedRole === 'admin') {
        window.location.href = 'admin/index.html';
      } else {
        window.location.href = 'index.html';
      }
    }, 700);
  }
</script>

</body>
</html>
